services:
  db:
    image: postgres:16-alpine
    container_name: terra-metrics-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terra_secret}
      POSTGRES_DB: ${POSTGRES_DB:-terra_metrics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terra} -d ${POSTGRES_DB:-terra_metrics}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-terra}:${POSTGRES_PASSWORD:-terra_secret}@db:5432/${POSTGRES_DB:-terra_metrics}?schema=public
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  edge:
    build:
      context: ./edge
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Docker network override: uses service name 'backend' instead of localhost
      - API_URL=http://backend:3000/api/metrics
    volumes:
      - ./edge:/app
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: